[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-sales-forecasting"
version = "0.1.0"
description = "INT3405: reproducible 16-day retail forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3"]

[project.optional-dependencies]
ml = ["lightgbm>=4.5,<5", "shap>=0.46,<1", "matplotlib>=3.8,<4"]
dl = ["torch>=2.4,<3"]
dev = ["ruff>=0.8,<1", "jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
